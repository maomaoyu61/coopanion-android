name: build-apk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Fetch Coopanion pet web assets from upstream
        run: |
          set -e
          curl -sSL -o coopanion.tar.gz https://codeload.github.com/Pal-AI-Lab/Coopanion/tar.gz/refs/heads/main
          tar xzf coopanion.tar.gz
          SRC=$(find . -maxdepth 5 -type d -name web -path '*cortico-world-desktop-pet*' | head -1)
          echo "asset source: $SRC"
          test -n "$SRC"
          mkdir -p app/src/main/assets
          cp -r "$SRC" app/src/main/assets/web
          echo "asset files: $(find app/src/main/assets/web -type f | wc -l)"

      - name: Install Gradle 8.7
        run: |
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip

      - name: Build debug APK
        run: ./gradle-8.7/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: coopanion-pet-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
