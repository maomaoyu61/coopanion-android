name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # runner 自带 Android SDK，不用 android-actions/setup-android
      # （那个 action 会去装已被移除的 'tools' 包，直接失败）
      - name: Install SDK packages
        run: |
          set -e
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager: $SDKMGR"
          test -n "$SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-34" "build-tools;34.0.0" || true
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Fetch Coopanion pet web assets from upstream
        run: |
          set -e
          curl -sSL -o coopanion.tar.gz https://codeload.github.com/Pal-AI-Lab/Coopanion/tar.gz/refs/heads/main
          tar xzf coopanion.tar.gz
          SRC=$(find . -type d -path '*/packages/cortico-world-desktop-pet/web' | head -1)
          echo "asset source: $SRC"
          test -n "$SRC"
          mkdir -p app/src/main/assets
          cp -r "$SRC" app/src/main/assets/web
          echo "asset files: $(find app/src/main/assets/web -type f | wc -l)"

      # ★ 老 WebView（Chromium < 80）不认 ?. / ?? / ??= / #private 这些现代语法，
      #   一旦语法错整个 JS 模块都不执行（表现：模型消失 + WebSocket 不连）。
      #   这里在构建期用 esbuild 把网页 JS 统一降级到 chrome70 能跑的语法。
      - name: Downlevel web assets for old WebViews
        run: |
          set -e
          n=0
          for f in $(find app/src/main/assets/web -name *.js); do
            npx --yes esbuild@0.21.5 "$f" --target=chrome70 --outfile="$f.out" --log-level=error
            mv "$f.out" "$f"
            n=$((n+1))
          done
          echo "downleveled $n js files"
          echo "剩余现代语法检查:"
          grep -rlE "\?\?=|\|\|=|&&=" app/src/main/assets/web --include=*.js || echo "  none (??=/||=/&&=)"

      - name: Install Gradle 8.7
        run: |
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip

      - name: Build debug APK
        run: ./gradle-8.7/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: coopanion-pet-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
